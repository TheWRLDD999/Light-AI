
name: Build Light AI Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Light AI files
        uses: actions/checkout@v4

      - name: Get llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build llama.cpp for 32-bit ARM
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"

          cmake -S llama.cpp -B llama.cpp/build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-23 \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_OPENSSL=OFF

          cmake --build llama.cpp/build-android \
            --target llama --parallel 2

      - name: Copy AI engine headers
        run: |
          mkdir -p android/app/src/main/cpp/include/llama
          mkdir -p android/app/src/main/cpp/include/ggml

          cp -v llama.cpp/include/*.h \
            android/app/src/main/cpp/include/llama/

          cp -v llama.cpp/ggml/include/*.h \
            android/app/src/main/cpp/include/ggml/

          echo "AI headers copied successfully"

      - name: Package engine libraries
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a

          find llama.cpp/build-android \
            -type f -name "*.so" \
            -exec cp -v {} android/app/src/main/jniLibs/armeabi-v7a/ \;

          echo "Packaged engine libraries:"
          ls -lh android/app/src/main/jniLibs/armeabi-v7a/

      - name: Verify library architecture
        run: |
          file android/app/src/main/jniLibs/armeabi-v7a/*.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Light AI APK
        run: gradle :android:app:assembleDebug

      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: Light-AI-Engine-Test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/jniLibs/armeabi-v7a/*.so
            
