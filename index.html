
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e17">
<meta name="description" content="Light AI - Think, Learn, Create">
<link rel="manifest" href="manifest.json">
<title>Light AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #100e17;
  color: #f5f2fa;
  font-family: system-ui, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  min-height: 70px;
  display: flex;
  align-items: center;
  padding: 10px 18px;
  border-bottom: 1px solid #292432;
}

header img {
  width: 175px;
  max-width: 65vw;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  width: 100%;
  max-width: 760px;
  margin: auto;
}

.welcome {
  text-align: center;
  margin: 10vh auto 30px;
}

.welcome img {
  width: 100px;
  height: 100px;
}

.welcome h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.welcome p {
  color: #aaa2b8;
}

.message {
  padding: 13px 16px;
  border-radius: 17px;
  margin: 12px 0;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #7650bd;
  margin-left: auto;
}

.assistant {
  background: #211d2b;
  border: 1px solid #302a3c;
}

.composer {
  padding: 12px 14px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid #292432;
  background: #100e17;
}

form {
  max-width: 760px;
  margin: auto;
  display: flex;
  gap: 9px;
  background: #211d2b;
  border: 1px solid #383044;
  border-radius: 20px;
  padding: 7px;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 11px;
  font: inherit;
  max-height: 120px;
}

button {
  border: 0;
  background: #8256d9;
  color: white;
  border-radius: 14px;
  padding: 0 17px;
  font-weight: 700;
}

button:disabled {
  opacity: .5;
}

.status {
  text-align: center;
  color: #aaa2b8;
  font-size: 11px;
  margin-top: 8px;
}

.progress-area {
  display: none;
  max-width: 760px;
  margin: 0 auto 12px;
  padding: 11px 13px;
  background: #211d2b;
  border: 1px solid #383044;
  border-radius: 14px;
}

.progress-heading {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #dcd3ed;
  font-size: 12px;
  margin-bottom: 8px;
}

.progress-track {
  height: 7px;
  background: #393044;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #7544c5, #bd91ff);
  border-radius: 20px;
  transition: width .25s ease;
}

.progress-note {
  color: #aaa2b8;
  font-size: 10px;
  margin-top: 7px;
}
</style>
</head>

<body>

<header>
  <img src="logo.svg" alt="Light AI">
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <img src="icon.svg" alt="Light AI icon">
    <h1>What can I help with?</h1>
    <p>A simpler space to think, learn and create.</p>
  </div>
</main>

<div class="composer">

  <div class="progress-area" id="progressArea">
    <div class="progress-heading">
      <span id="progressLabel">Preparing Light AI...</span>
      <span id="progressPercent">0%</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="progress-note" id="progressNote">
      Getting everything ready...
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1"
      placeholder="Message Light AI..." required></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <div class="status" id="status">
    Light AI · Ready to start
  </div>
</div>

<script type="module">
import { pipeline } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";

const MODEL =
  "onnx-community/SmolLM2-135M-Instruct-ONNX";

const form = document.getElementById("form");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const status = document.getElementById("status");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");

const progressArea = document.getElementById("progressArea");
const progressFill = document.getElementById("progressFill");
const progressPercent = document.getElementById("progressPercent");
const progressLabel = document.getElementById("progressLabel");
const progressNote = document.getElementById("progressNote");

let generator = null;
let busy = false;

const personality = `
You are Light AI, a friendly personal AI assistant.

YOUR PERSONALITY:
- Friendly and welcoming.
- Clever, curious and interested in learning.
- Patient when explaining things.
- Playful, with a natural sense of humour.
- Encouraging without being annoying.
- Honest when you do not know something.
- Creative and imaginative.
- Adapt your explanations to the person chatting.

YOUR BEHAVIOUR:
- Talk naturally, like a helpful conversational assistant.
- Be warm without overusing emojis.
- Give clear and useful answers.
- Ask a short follow-up question when it genuinely helps.
- Remember the conversation context provided to you.
- Never pretend to know something you do not know.
- Keep simple answers short and explain complicated things clearly.

You are Light AI.
Your motto is THINK, LEARN, CREATE.
`;

const conversation = [
  {
    role: "system",
    content: personality
  }
];

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;

  return message;
}

function updateProgress(info) {
  if (info.status === "progress_total" &&
      typeof info.progress === "number") {

    const percent = Math.max(
      0,
      Math.min(100, info.progress)
    );

    progressFill.style.width = percent + "%";
    progressPercent.textContent =
      Math.round(percent) + "%";

    progressLabel.textContent =
      "Downloading Light AI's brain...";

    progressNote.textContent =
      "Downloading model files...";
  }

  if (info.status === "ready") {
    progressFill.style.width = "100%";
    progressPercent.textContent = "100%";
    progressLabel.textContent =
      "Preparing Light AI...";
    progressNote.textContent =
      "Getting your assistant ready...";
  }
}

async function loadModel() {
  if (generator) return;

  progressArea.style.display = "block";

  progressLabel.textContent =
    "Downloading Light AI's brain...";

  progressNote.textContent =
    "Preparing the model...";

  progressFill.style.width = "0%";
  progressPercent.textContent = "0%";

  status.textContent = "Loading Light AI...";

  generator = await pipeline(
    "text-generation",
    MODEL,
    {
      dtype: "q4",
      device: "wasm",
      progress_callback: updateProgress
    }
  );

  progressFill.style.width = "100%";
  progressPercent.textContent = "100%";

  progressLabel.textContent =
    "Light AI is ready";

  progressNote.textContent =
    "Your assistant is ready to chat!";

  status.textContent = "Light AI 💜 Ready";
}

async function sendMessage(text) {
  if (busy) return;

  busy = true;
  send.disabled = true;
  input.disabled = true;

  welcome?.remove();

  addMessage(text, "user");

  conversation.push({
    role: "user",
    content: text
  });

  const thinking = addMessage(
    "Thinking...",
    "assistant"
  );

  try {
    await loadModel();

    status.textContent =
      "Light AI is thinking...";

    const recentMessages = [
      conversation[0],
      ...conversation.slice(-4)
    ];

    const result = await generator(
      recentMessages,
      {
        max_new_tokens: 80,
        temperature: 0.7,
        do_sample: true
      }
    );

    const generated = result[0].generated_text;

    const answer = Array.isArray(generated)
      ? generated[generated.length - 1].content
      : String(generated);

    const cleanAnswer = String(answer).trim();

    thinking.textContent = cleanAnswer ||
      "I couldn't generate an answer. Please try again.";

    conversation.push({
      role: "assistant",
      content: cleanAnswer
    });

    status.textContent = "Light AI · Ready";

  } catch (error) {
    console.error(error);

    const detail = String(
      error?.message || error
    ).slice(0, 500);

    thinking.textContent =
      "TEMPORARY DIAGNOSTIC ERROR:\n" + detail;

    status.textContent = "AI loading error";

    progressLabel.textContent =
      "Something went wrong";

    progressNote.textContent =
      "Temporary diagnostic mode is active.";

    generator = null;
  }

  finally {
    busy = false;
    send.disabled = false;
    input.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();

  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";
  sendMessage(text);
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>

</body>
</html>
