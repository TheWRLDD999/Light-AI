
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e17">
<meta name="description" content="Light AI - Think, Learn, Create">
<link rel="manifest" href="manifest.json">
<title>Light AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #100e17;
  color: #f5f2fa;
  font-family: system-ui, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  min-height: 70px;
  display: flex;
  align-items: center;
  padding: 10px 18px;
  border-bottom: 1px solid #292432;
}

header img {
  width: 175px;
  max-width: 65vw;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  width: 100%;
  max-width: 760px;
  margin: auto;
}

.welcome {
  text-align: center;
  margin: 10vh auto 30px;
}

.welcome img {
  width: 100px;
  height: 100px;
}

.welcome h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.welcome p {
  color: #aaa2b8;
}

.message {
  padding: 13px 16px;
  border-radius: 17px;
  margin: 12px 0;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #7650bd;
  margin-left: auto;
}

.assistant {
  background: #211d2b;
  border: 1px solid #302a3c;
}

.composer {
  padding: 12px 14px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid #292432;
  background: #100e17;
}

form {
  max-width: 760px;
  margin: auto;
  display: flex;
  gap: 9px;
  background: #211d2b;
  border: 1px solid #383044;
  border-radius: 20px;
  padding: 7px;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 11px;
  font: inherit;
  max-height: 120px;
}

button {
  border: 0;
  background: #8256d9;
  color: white;
  border-radius: 14px;
  padding: 0 17px;
  font-weight: 700;
}

button:disabled {
  opacity: .5;
}

.status {
  text-align: center;
  color: #aaa2b8;
  font-size: 11px;
  margin-top: 8px;
}

</style>
</head>

<body>

<header>
  <img src="logo.svg" alt="Light AI">
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <img src="icon.svg" alt="Light AI icon">
    <h1>What can I help with?</h1>
    <p>A simpler space to think, learn and create.</p>
  </div>
</main>

<div class="composer">
  <form id="form">
    <textarea id="input" rows="1"
      placeholder="Message Light AI..." required></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <div class="status" id="status">
    Light AI · Ready to start
  </div>
</div>

<script type="module">
import { pipeline } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";

const MODEL = "HuggingFaceTB/SmolLM2-135M-Instruct";

const form = document.getElementById("form");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const status = document.getElementById("status");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");

let generator = null;
let busy = false;

const conversation = [
  {
    role: "system",
    content: "You are Light AI, a friendly, helpful and clear assistant. Give simple, useful answers. Be honest when you don't know something."
  }
];

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
  return message;
}

async function loadModel() {
  if (generator) return;

  status.textContent = "Downloading Light AI's brain...";

  generator = await pipeline(
    "text-generation",
    MODEL
  );

  status.textContent = "Light AI is ready 💜";
}

async function sendMessage(text) {
  if (busy) return;

  busy = true;
  send.disabled = true;
  input.disabled = true;

  welcome?.remove();

  addMessage(text, "user");

  conversation.push({
    role: "user",
    content: text
  });

  const thinking = addMessage(
    "Thinking...",
    "assistant"
  );

  try {
    await loadModel();

    status.textContent = "Light AI is thinking...";

    const recentMessages = [
      conversation[0],
      ...conversation.slice(-8)
    ];

    const result = await generator(
      recentMessages,
      {
        max_new_tokens: 100,
        temperature: 0.7,
        do_sample: true
      }
    );

    const generated = result[0].generated_text;

    const answer = Array.isArray(generated)
      ? generated[generated.length - 1].content
      : String(generated);

    thinking.textContent = answer.trim() ||
      "I couldn't generate an answer. Try again.";

    conversation.push({
      role: "assistant",
      content: answer
    });

    status.textContent = "Light AI · Ready";

  } catch (error) {
    console.error(error);

    thinking.textContent =
      "I couldn't load or run my AI model. Please check your internet connection and try again.";

    status.textContent = "AI loading error";
    generator = null;

  } finally {
    busy = false;
    send.disabled = false;
    input.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();

  const text = input.value.trim();
  if (!text || busy) return;

  input.value = "";
  sendMessage(text);
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>

</body>
  </html>
