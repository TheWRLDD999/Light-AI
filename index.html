
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e17">
<meta name="description" content="Light AI - Think, Learn, Create">
<link rel="manifest" href="manifest.json">
<title>Light AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #100e17;
  color: #f5f2fa;
  font-family: system-ui, sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  min-height: 70px;
  display: flex;
  align-items: center;
  padding: 10px 18px;
  border-bottom: 1px solid #292432;
}

header img {
  width: 175px;
  max-width: 65vw;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  width: 100%;
  max-width: 760px;
  margin: auto;
}

.welcome {
  text-align: center;
  margin: 10vh auto 30px;
}

.welcome img {
  width: 100px;
  height: 100px;
}

.welcome h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.welcome p {
  color: #aaa2b8;
}

.message {
  padding: 13px 16px;
  border-radius: 17px;
  margin: 12px 0;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #7650bd;
  margin-left: auto;
}

.assistant {
  background: #211d2b;
  border: 1px solid #302a3c;
}

.composer {
  padding: 12px 14px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid #292432;
  background: #100e17;
}

.prepare-area {
  max-width: 760px;
  margin: 0 auto 12px;
  text-align: center;
}

.prepare-button {
  padding: 12px 20px;
  border: 0;
  background: #8256d9;
  color: white;
  border-radius: 14px;
  font-weight: 700;
  font-size: 14px;
}

form {
  max-width: 760px;
  margin: auto;
  display: flex;
  gap: 9px;
  background: #211d2b;
  border: 1px solid #383044;
  border-radius: 20px;
  padding: 7px;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 11px;
  font: inherit;
  max-height: 120px;
}

button {
  cursor: pointer;
}

form button {
  border: 0;
  background: #8256d9;
  color: white;
  border-radius: 14px;
  padding: 0 17px;
  font-weight: 700;
}

button:disabled {
  opacity: .5;
}

.status {
  text-align: center;
  color: #aaa2b8;
  font-size: 11px;
  margin-top: 8px;
}

.progress-area {
  display: none;
  max-width: 760px;
  margin: 0 auto 12px;
  padding: 11px 13px;
  background: #211d2b;
  border: 1px solid #383044;
  border-radius: 14px;
}

.progress-heading {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #dcd3ed;
  font-size: 12px;
  margin-bottom: 8px;
}

.progress-track {
  height: 7px;
  background: #393044;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #7544c5, #bd91ff);
  border-radius: 20px;
  transition: width .25s ease;
}

.progress-note {
  color: #aaa2b8;
  font-size: 10px;
  margin-top: 7px;
}
</style>
</head>

<body>

<header>
  <img src="logo.svg" alt="Light AI">
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <img src="icon.svg" alt="Light AI icon">
    <h1>What can I help with?</h1>
    <p>A simpler space to think, learn and create.</p>
  </div>
</main>

<div class="composer">

  <div class="progress-area" id="progressArea">
    <div class="progress-heading">
      <span id="progressLabel">Preparing Light AI...</span>
      <span id="progressPercent">0%</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="progress-note" id="progressNote">
      Getting everything ready...
    </div>
  </div>

  <div class="prepare-area">
    <button class="prepare-button" id="prepareButton" type="button">
      Download / Load AI
    </button>
  </div>

  <form id="form">
    <textarea id="input" rows="1"
      placeholder="Message Light AI..." required></textarea>
    <button id="send" type="submit" disabled>Send</button>
  </form>

  <div class="status" id="status">
    Light AI · Ready to prepare
  </div>
</div>

<script>
const form = document.getElementById("form");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const status = document.getElementById("status");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");

const prepareButton = document.getElementById("prepareButton");
const progressArea = document.getElementById("progressArea");
const progressFill = document.getElementById("progressFill");
const progressPercent = document.getElementById("progressPercent");
const progressLabel = document.getElementById("progressLabel");
const progressNote = document.getElementById("progressNote");

let busy = false;
let modelReady = false;

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;

  return message;
}

function setReady() {
  modelReady = true;
  send.disabled = false;
  prepareButton.style.display = "none";
  progressArea.style.display = "block";

  progressFill.style.width = "100%";
  progressPercent.textContent = "100%";
  progressLabel.textContent = "Light AI is ready";
  progressNote.textContent = "Your assistant is ready to chat!";
  status.textContent = "Light AI · Ready 💜";
}

function showProgress(message) {
  progressArea.style.display = "block";
  status.textContent = message;

  const match = message.match(/(\d+)%/);

  if (match) {
    const percent = Math.min(100, Number(match[1]));
    progressFill.style.width = percent + "%";
    progressPercent.textContent = percent + "%";
    progressLabel.textContent = "Downloading Light AI's brain...";
    progressNote.textContent = "Downloading model files...";
  } else {
    progressLabel.textContent = "Preparing Light AI...";
    progressNote.textContent = message;
  }

  if (message.includes("loaded successfully")) {
    setReady();
  } else if (
    message.includes("failed") ||
    message.includes("Failed") ||
    message.includes("Not enough") ||
    message.includes("Could not")
  ) {
    prepareButton.style.display = "inline-block";
    prepareButton.disabled = false;
    prepareButton.textContent = "Try Again";
    progressLabel.textContent = "Something went wrong";
    progressNote.textContent = message;
  }
}

window.onLightAIStatus = function(message) {
  showProgress(String(message));
};

window.onLightAIResponse = function(message) {
  const thinking = document.getElementById("thinking");

  if (thinking) {
    thinking.textContent = String(message);
    thinking.removeAttribute("id");
  }

  status.textContent = "Light AI · Ready";
  busy = false;
  send.disabled = false;
  input.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
};

prepareButton.addEventListener("click", function() {
  if (!window.LightAI) {
    status.textContent =
      "Please open Light AI using the installed Android app.";
    return;
  }

  prepareButton.disabled = true;
  prepareButton.textContent = "Preparing...";
  progressArea.style.display = "block";
  progressLabel.textContent = "Starting Light AI...";
  progressNote.textContent = "Connecting to the AI engine...";
  status.textContent = "Preparing Light AI...";

  try {
    const result = window.LightAI.getModelStatus();

    if (result === "READY") {
      setReady();
      return;
    }

    if (result === "DOWNLOADING") {
      showProgress("Download already in progress...");
      return;
    }

    window.LightAI.downloadModel();

  } catch (error) {
    prepareButton.disabled = false;
    prepareButton.textContent = "Try Again";
    status.textContent = "Could not start AI: " + error.message;
  }
});

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const text = input.value.trim();

  if (!text || busy) return;

  if (!modelReady || !window.LightAI) {
    status.textContent = "Please prepare Light AI first.";
    return;
  }

  busy = true;
  send.disabled = true;
  input.disabled = true;

  welcome?.remove();

  addMessage(text, "user");
  input.value = "";

  const thinking = addMessage("Thinking...", "assistant");
  thinking.id = "thinking";

  status.textContent = "Light AI is thinking...";

  try {
    window.LightAI.sendMessage(text);
  } catch (error) {
    thinking.textContent =
      "Sorry, something went wrong: " + error.message;

    busy = false;
    send.disabled = false;
    input.disabled = false;
    status.textContent = "Light AI · Ready";
  }
});

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

if (window.LightAI) {
  try {
    if (window.LightAI.getModelStatus() === "READY") {
      setReady();
    }
  } catch (error) {
    status.textContent = "Light AI · Ready to prepare";
  }
} else {
  status.textContent = "Light AI · Open the installed app";
}
</script>

</body>
      </html>
